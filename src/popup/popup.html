<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lurk</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="top">
        <img src="icons/icon-48.png" width="40" height="40" alt="" />
        <span class="brand">Lurk</span>
        <span id="version" class="version"></span>
        <button id="theme" type="button" class="icon-button" aria-label="Switch to dark theme">
          <svg
            class="sun"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path
              d="M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8z M12 2v2 M12 20v2 M4.9 4.9l1.4 1.4 M17.7 17.7l1.4 1.4 M2 12h2 M20 12h2 M4.9 19.1l1.4-1.4 M17.7 6.3l1.4-1.4"
            />
          </svg>
          <svg
            class="moon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
          </svg>
        </button>
      </header>

      <section id="hero" class="hero" aria-labelledby="enabled-label">
        <div class="hero-head">
          <div>
            <h1 id="enabled-label">Lurk mode</h1>
            <p class="tagline">Read it. Nobody knows.</p>
          </div>
          <input
            id="enabled"
            type="checkbox"
            role="switch"
            class="switch switch-hero"
            aria-labelledby="enabled-label"
            aria-describedby="status"
          />
        </div>
        <p id="status" class="pill" role="status" aria-live="polite"></p>
      </section>

      <section class="site" aria-labelledby="site-heading">
        <h2 id="site-heading" class="section-label">Hide</h2>
        <div class="rows">
          <label class="row">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z"
              />
            </svg>
            <span class="row-label">Seen on messages</span>
            <span class="unsupported"></span>
            <input type="checkbox" role="switch" class="switch" data-signal="seen" />
          </label>
          <label class="row">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 5h16v11H10l-5 4v-4H4z M8.5 10.5h.01 M12 10.5h.01 M15.5 10.5h.01" />
            </svg>
            <span class="row-label">Typing</span>
            <span class="unsupported"></span>
            <input type="checkbox" role="switch" class="switch" data-signal="typing" />
          </label>
          <label class="row">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18z M10 8.6v6.8l5.4-3.4z" />
            </svg>
            <span class="row-label">Story views</span>
            <span class="unsupported"></span>
            <input type="checkbox" role="switch" class="switch" data-signal="stories" />
          </label>
        </div>
      </section>

      <button id="pass" type="button" class="pass">Let receipts through for 10 s</button>

      <details class="stats">
        <summary>Stats</summary>
        <p id="stats-total" class="stats-total"></p>
        <ul id="stats-list" class="stats-list"></ul>
        <p class="stats-hint">
          Counted on this computer only. Seen = chats read without a receipt; typing = typing
          bursts.
        </p>
        <button id="reset-stats" type="button" class="link-button">Reset stats</button>
      </details>

      <p id="tip" class="tip"></p>
      <p id="works-on" class="works-on"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
