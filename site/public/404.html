<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Lurk</title>
    <!-- GitHub Pages serves this file for any missing path, at any depth, so every link is absolute
         and the styles are inline (the site's relative assets would not resolve here). -->
    <link rel="icon" href="https://botjaeger.github.io/lurk/icon-32.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #0b0c0b;
        color: #eef1ec;
        font:
          400 17px/1.55 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        overflow-wrap: break-word;
      }
      main {
        max-width: 480px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 40px;
        line-height: 1.1;
      }
      p {
        margin: 0 0 24px;
        color: #c9cfc8;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 10px 18px;
        border-radius: 999px;
        background: #1fd566;
        color: #06210f;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #1fd566;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>This page does not exist. Lurk's website has a home page, a privacy policy and terms.</p>
      <a href="https://botjaeger.github.io/lurk/">Go to the Lurk home page</a>
    </main>
  </body>
</html>
